name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-dev xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: SPDX headers
        run: npm run check:spdx

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Chat layout regression
        run: xvfb-run -a node scripts/run-chat-tools-ui-screenshots.mjs

      - name: Upload chat layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-layout-screenshots
          path: screenshots/chat-tools-ui
          if-no-files-found: warn
